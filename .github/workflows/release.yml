name: Release assets

# À chaque release publiée : construit le .plugin et les zips de skills, et les attache à la release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-skills.sh
      - run: bash scripts/package.sh
      - name: Attacher les paquets à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/obsidian-memory.plugin dist/skills/*.zip --clobber
